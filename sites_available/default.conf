server {
    listen 80 default_server;
    listen [::]:80 default_server;

    access_log off;

    location / {
        add_header 'Content-Type' 'text/plain';
        return 200 'Greetings, explorer!';
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}
